  detail: >-
    Con-way was absorbed into XPO Logistics in 2015 and the brand was retired
    in 2017; con-way.com is now an XPO-owned redirect — the apex 302s to
    www.xpo.com and www.con-way.com 302s to XPO's LTL customer portal at
    ext-web.ltl-xpo.com/landing — so there is no Con-way-branded developer
    surface left to read, and every tracking "API" search returns third-party
    aggregators (AfterShip, TrackingMore, Shipway) rather than a Con-way
    contract.
