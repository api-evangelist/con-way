description: >-
  Con-way Inc. was a North American freight transportation and logistics
  company best known for its Less-Than-Truckload (LTL) carrier Con-way
  Freight along with Menlo Logistics, Con-way Truckload, and Con-way
  Multimodal. On October 30, 2015, XPO Logistics completed a $3 billion
  acquisition of Con-way; by May 2017 the Con-way brand had been
  fully retired in favor of XPO. This profile is preserved as a
  historical record; Con-way no longer operates under this name and
  modern shipping APIs are surfaced under XPO.
